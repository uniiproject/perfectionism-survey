}

.box{

  border-radius:20px;
  padding:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.progress{
  height:10px;
  background:#f3d6e3;
  border-radius:50px;
  overflow:hidden;
  margin-bottom:20px;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff7aa2,#ffb3c7);
  transition:width .4s ease;
}

.btn{
  background:linear-gradient(135deg,#ff7aa2,#ff4f86);
  color:#fff;
  border:none;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
  margin-top:15px;
}

.option{
  display:block;
  padding:12px;
  border:1px solid #f0c2d1;
  border-radius:12px;
  margin:10px 0;
}

.fade{
  animation:fade .25s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

.thanks{
  text-align:center;
  padding:40px 20px;
}
</style>
</head>

<body>
