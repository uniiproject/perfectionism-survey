<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پرسشنامه کمال‌گرایی</title><style>
body{
  font-family:tahoma;
  margin:0;
  background:linear-gradient(135deg,#ffe4ec,#fff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box{
  width:90%;
  max-width:750px;
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
.btn{
  background:#ff4f86;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}
.option{
  display:block;
  margin:10px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
}
</style></head>
<body><div class="box">
  <div id="app"></div>
</div><script>

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3WirPua6WTzvETcmdI_hHWM8ciNE2K1vjSZgJLR_ULB3rIgyoyG8xcGMhmIRQYW-YEQ/exec";

const introText = `
شرکت‌کننده گرامی،

این پرسشنامه صرفاً در چارچوب یک پژوهش دانشگاهی تهیه شده است. تمامی اطلاعات و پاسخ‌های ارائه‌شده توسط شما کاملاً محرمانه تلقی شده و فقط برای اهداف علمی و پژوهشی مورد استفاده قرار خواهد گرفت. همچنین هیچ‌یک از اطلاعات فردی یا نتایج پاسخ‌ها در اختیار اشخاص یا نهادهای دیگر قرار نخواهد گرفت و از انتشار آن‌ها به هر شکل جلوگیری خواهد شد.

از اینکه با صرف وقت و دقت خود در این پژوهش مشارکت می‌کنید، صمیمانه سپاسگزاریم. همکاری ارزشمند شما نقش مهمی در پیشبرد این تحقیق خواهد داشت.
`;

const questions = [
"نمیتوانم حتی یک اشتباه را در کارم تحمل کنم.",
"به چیزی کمتر از کامل و ایده‌آل بودم قانع نمیشوم.",
"هرچقدر کاری را خوب انجام داده باشم، بازم از عملکردم ناراضی هستم.",
"بعد از موفقیت هم احساس نارضایتی میکنم.",
"احساس میکنم همیشه در زندگی باید موفق باشم.",
"اهداف و آرمان هایم بسیار عالی هستند.",
"هرچقدر کاری را درست انجام داده باشم باز هم حس میکنم کاملا درست انجام نداده‌ام.",
"اگر حتی یک اشتباه در کارم باشد ناراحت و آشفته میشوم.",
"درمورد هرکار جزئی که انجام میدهم تردید میکنم.",
"احساس میکنم که خیلی کمال گرا هستم.",
"از بستگانم انتظار دارم که کامل و ایده آل باشند.",
"وقتی از کسی میخواهم کاری را انجام دهد انتظار دارم کامل و بدون نقص انجام دهد.",
"حوصله کسانی که برای بهتر شدن خودشان تلاش و پیشرفت میکنند را ندارم.",
"نمیتوانم اشتباه دیگران را تحمل کنم.",
"هیچوقت از عملکرد دیگران احساس رضایت نمیکنم.",
"انتظار دارم دیگران همواره منظم و دقیق باشند.",
"وقتی کسی کاری را نصفه نیمه انجام میدهد، احساس میکنم اصلا کاری انجام نداده است.",
"انتظار دارم دیگران به دنبال اهداف و آرمان های عالی باشند.",
"تصور میکنم دیگران بتوانند انتظارات من را براورده سازند.",
"نمیتوانم نسبت به کسانی که برای تحقق اهداف و آرمان های عالی تلاش نمیکنند احساس خوبی داشته باشم.",
"خانواده از من توقع دارند کامل و ایده‌آل باشم.",
"اطرافیانم انتظار دارند در همه کارها موفق باشم.",
"وقتی کاری را انجام میدهم احساس میکنم دیگران با دید انتقادی آن را قضاوت خواهند کرد.",
"هرچقدر کاری را عالی و بی نقص انجام میدهم باز هم دیگران انتظار دارند کامل تر انجام دهم.",
"احساس میکنم دیگران بیش از حد از من توقع دارند.",
"در کودکی هرگاه کاری را درست انجام نمیدادم سرزنش و تنبیه میشدم.",
"والدینم هیچ وقت اشتباهات من را نادیده نگرفتند.",
"والدینم از من میخواستند که در هرکاری و هرچیزی عالی باشم.",
"تصور میکنم هرگز نمیتوانم انتظارات و توقعات خانواده ام را براورده سازم.",
"اگر اشتباهی از من سر بزند دیگران با دیده تحقیر به من نگاه میکنند."
];

const options = ['کاملاً موافق','موافق','نظری ندارم','مخالف','کاملاً مخالف'];

let step = -1;
let answers = {};

const app = document.getElementById('app');

function render(){

  if(step === -1){
    app.innerHTML = `
      <p style="white-space:pre-line;line-height:2">${introText}</p>
      <button class="btn" onclick="startIntro()">شروع</button>
    `;
    return;
  }

  if(step === 0){
    app.innerHTML = `
      <h3>اطلاعات فردی</h3>

      <label>سن:
        <input id="age" type="number">
      </label>

      <br><br>

      <label><input type="radio" name="g" value="زن"> زن</label>
      <label><input type="radio" name="g" value="مرد"> مرد</label>

      <br>

      <button class="btn" onclick="startSurvey()">ادامه</button>
    `;
    return;
  }

  const q = questions[step-1];

  app.innerHTML = `
    <h3>سوال ${step} از ${questions.length}</h3>
    <p>${q}</p>

    ${options.map(o => `
      <label class="option">
        <input type="radio" name="ans" value="${o}">
        ${o}
      </label>
    `).join('')}

    <button class="btn" onclick="nextQuestion()">بعدی</button>
  `;
}

function startIntro(){
  step = 0;
  render();
}

function startSurvey(){

  const gender = document.querySelector('input[name="g"]:checked');

  if(!gender){
    alert("جنسیت را انتخاب کنید");
    return;
  }

  answers.age = document.getElementById("age").value;
  answers.gender = gender.value;

  step = 1;
  render();
}

function nextQuestion(){

  const ans = document.querySelector('input[name="ans"]:checked');

  if(!ans){
    alert("یک گزینه انتخاب کنید");
    return;
  }

  answers["q"+step] = ans.value;

  if(step < questions.length){
    step++;
    render();
  }else{
    finish();
  }
}

function finish(){

  fetch(GOOGLE_SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      age:answers.age,
      gender:answers.gender,
      answers:questions.map((_,i)=>answers["q"+(i+1)])
    })
  });

  app.innerHTML = `
    <h2>🎉 پایان پرسشنامه</h2>
    <p>پاسخ شما با موفقیت ثبت شد.</p>
  `;
}

render();

</script></body>
</html>
