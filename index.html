<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پرسشنامه کمال‌گرایی</title>

<style>
body{
  font-family:tahoma;
  margin:0;
  background:linear-gradient(135deg,#ffe4ec,#fff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:90%;
  max-width:750px;
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.btn{
  background:#ff4f86;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

.option{
  display:block;
  margin:10px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="box">
  <div id="app"></div>
</div>

<script>

const GOOGLE_SCRIPT_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE";

const introText = `
شرکت‌کننده گرامی،

این پرسشنامه صرفاً در چارچوب یک پژوهش دانشگاهی تهیه شده است. تمامی اطلاعات و پاسخ‌های ارائه‌شده توسط شما کاملاً محرمانه تلقی شده و فقط برای اهداف علمی و پژوهشی مورد استفاده قرار خواهد گرفت. همچنین هیچ‌یک از اطلاعات فردی یا نتایج پاسخ‌ها در اختیار اشخاص یا نهادهای دیگر قرار نخواهد گرفت و از انتشار آن‌ها به هر شکل جلوگیری خواهد شد.

از اینکه با صرف وقت و دقت خود در این پژوهش مشارکت می‌کنید، صمیمانه سپاسگزاریم. همکاری ارزشمند شما نقش مهمی در پیشبرد این تحقیق خواهد داشت.
`;

const questions = [
'نمیتوانم اشتباه را تحمل کنم.',
'به کمتر از کامل راضی نیستم.',
'بعد از موفقیت هم ناراضی هستم.',
'باید همیشه موفق باشم.',
'اهدافم خیلی ایده‌آل هستند.',
'هیچ وقت کامل نیستم.',
'اشتباه مرا ناراحت میکند.',
'در تصمیم‌ها تردید دارم.',
'از دیگران انتظار کامل بودن دارم.',
'دیگران را زیاد نقد میکنم.',
'از عملکرد دیگران راضی نیستم.',
'کار نصفه را قبول ندارم.',
'در کودکی زیاد سرزنش شدم.'
];

const options = ['کاملاً موافق','موافق','نظری ندارم','مخالف','کاملاً مخالف'];

let step = -1;
let answers = {};

const app = document.getElementById('app');

function render(){

  // 🟣 صفحه معرفی
  if(step === -1){
    app.innerHTML = `
      <div>
        <p style="white-space:pre-line; line-height:1.8">${introText}</p>
        <button class="btn" onclick="startIntro()">شروع</button>
      </div>
    `;
    return;
  }

  // 🟢 اطلاعات فردی
  if(step === 0){
    app.innerHTML = `
      <div>
        <h3>اطلاعات فردی</h3>

        <label>سن: <input id="age" type="number"></label><br><br>

        <label><input type="radio" name="g" value="زن"> زن</label>
        <label><input type="radio" name="g" value="مرد"> مرد</label>

        <br>
        <button class="btn" onclick="startSurvey()">ادامه</button>
      </div>
    `;
    return;
  }

  // 🔵 سوالات
  const q = questions[step - 1];

  app.innerHTML = `
    <div>
      <h3>سوال ${step} از ${questions.length}</h3>
      <p>${q}</p>

      ${options.map(o => `
        <label class="option">
          <input type="radio" name="ans" value="${o}">
          ${o}
        </label>
      `).join('')}

      <button class="btn" onclick="next()">بعدی</button>
    </div>
  `;
}

window.startIntro = function(){
  step = 0;
  render();
}

window.startSurvey = function(){
  const g = document.querySelector('input[name=g]:checked');

  if(!g){
    alert('جنسیت را انتخاب کنید');
    return;
  }

  answers.age = document.getElementById('age').value;
  answers.gender = g.value;

  step = 1;
  render();
}

window.next = function(){
  const a = document.querySelector('input[name=ans]:checked');

  if(!a){
    alert('یک گزینه انتخاب کنید');
    return;
  }

  answers['q'+step] = a.value;

  if(step < questions.length){
    step++;
    render();
  } else {
    finish();
  }
}

/* 📊 ارسال به Google Sheets */
function finish(){

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      age: answers.age,
      gender: answers.gender,
      answers: questions.map((_,i)=>answers['q'+(i+1)])
    })
  });

  app.innerHTML = `
    <div>
      <h2>🎉 پایان پرسشنامه</h2>
      <p>پاسخ شما با موفقیت ثبت شد</p>
    </div>
  `;
}

render();

</script>

</body>
</html>
