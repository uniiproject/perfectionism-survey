<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پرسشنامه کمال‌گرایی</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Vazirmatn',tahoma;
  margin:0;
  background:linear-gradient(135deg,#ffe4ec,#fff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  width:90%;
  max-width:780px;
  background:#fff;
  border-radius:20px;
  padding:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.progress{
  height:10px;
  background:#f3d6e3;
  border-radius:50px;
  overflow:hidden;
  margin-bottom:20px;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff7aa2,#ffb3c7);
  transition:width .3s ease;
}

.btn{
  background:linear-gradient(135deg,#ff7aa2,#ff4f86);
  color:#fff;
  border:none;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
  margin-top:15px;
}

.option{
  display:block;
  padding:12px;
  border:1px solid #f0c2d1;
  border-radius:12px;
  margin:10px 0;
}

.fade{
  animation:fade .2s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="box">
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div id="app"></div>
</div>

<script>

const introText = `
شرکت‌کننده گرامی،

این پرسشنامه صرفاً در چارچوب یک پژوهش دانشگاهی تهیه شده است. تمامی اطلاعات و پاسخ‌های شما کاملاً محرمانه بوده و فقط برای اهداف علمی استفاده می‌شود.

از همکاری شما صمیمانه سپاسگزاریم.
`;

const questions = [
'  'کار نصفه را قبول ندارم.',
  'از افراد بی‌هدف خوشم نمی‌آید.',
  'دیگران از من توقع دارند.',
  'زیر فشار قضاوت هستم.',
  'در کودکی سرزنش می‌شدم.'
];

const opts = ['کاملاً موافق','موافق','نظری ندارم','مخالف','کاملاً مخالف'];

let step = 0;
let answers = {};

const app = document.getElementById('app');
const bar = document.getElementById('bar');

function render(){

  bar.style.width = step ? (step / questions.length) * 100 + '%' : '0%';

  if(step === 0){
    app.innerHTML = `
      <div class="fade">
        <h2>پرسشنامه کمال‌گرایی</h2>

        <label>سن: <input id="age" type="number"></label><br><br>

        <label><input type="radio" name="g" value="زن"> زن</label>
        <label><input type="radio" name="g" value="مرد"> مرد</label>

        <br>
        <button class="btn" onclick="start()">شروع</button>
      </div>
    `;
    return;
  }

  const q = questions[step - 1];

  app.innerHTML = `
    <div class="fade">
      <h3>سوال ${step} از ${questions.length}</h3>
      <p>${q}</p>

      ${opts.map(o => `
        <label class="option">
          <input type="radio" name="ans" value="${o}">
          ${o}
        </label>
      `).join('')}

      <button class="btn" onclick="next()">بعدی</button>
    </div>
  `;
}

window.start = function(){
  const g = document.querySelector('input[name=g]:checked');

  if(!g){
    alert('جنسیت را انتخاب کنید');
    return;
  }

  answers.gender = g.value;
  answers.age = document.getElementById('age').value;

  step = 1;
  render();
}

window.next = function(){
  const a = document.querySelector('input[name=ans]:checked');

  if(!a){
    alert('یک گزینه انتخاب کنید');
    return;
  }

  answers['q'+step] = a.value;

  if(step < questions.length){
    step++;
    render();
  } else {
    finish();
  }
}

function finish(){
  bar.style.width = '100%';

  app.innerHTML = `
    <div class="fade">
      <h2>🎉 پایان</h2>
      <p>پاسخ‌ها ثبت شد</p>
    </div>
  `;
}

render();

</script>
