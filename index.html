<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پرسشنامه فرسودگی تحصیلی</title>

<style>
body{
  font-family:tahoma;
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;

  /* 🌸 بک‌گراند گل صورتی واقعی */
  background-image: url("https://images.unsplash.com/photo-1526045612212-70caf35c14df?auto=format&fit=crop&w=1600&q=80");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* لایه روشن برای خوانایی بهتر */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255, 230, 245, 0.65);
  z-index:0;
}

.box{
  width:90%;
  max-width:750px;
  background:rgba(255,255,255,0.92);
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  position:relative;
  z-index:1;
}

.btn{
  background:#b388ff;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

.option{
  display:block;
  margin:10px 0;
  padding:10px;
  border:1px solid #e0d4ff;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="box">
  <div id="app"></div>
</div>

<script>

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9kjcA-k_lNqYOAxEVrm3mbfXfM6i_2pIA5NpanLUWpnZOzbWlji23zDU4c8k5-iFg/exec";

/* ---------- INTRO ---------- */
const introText = `
پرسشنامه فرسودگی تحصیلی

این پرسشنامه صرفاً برای اهداف پژوهشی طراحی شده است.
اطلاعات شما کاملاً محرمانه است و فقط برای پژوهش استفاده می‌شود.

از همکاری شما سپاسگزاریم.
`;

/* ---------- QUESTIONS ---------- */
const questions = [
"احساس میکنم که به خاطر فعالیت های مربوط به تحصیل تهی شده‌ام.",
"در پایان روز در دانشگاه احساس بی رمقی میکنم.",
"وقتی صبح بیدار میشوم و مجبورم روز دیگری در دانشگاه سپری کنم احساس خستگی میکنم.",
"با مطالعه یا حضور در کلاس به من فشار می‌آید.",
"به خاطر انجام فعالیت های مربوط به تحصیل احساس فرسودگی میکنم.",
"از زمان قبولی و ثبت نام در دانشگاه نسبت به دروسم کم علاقه شده‌ام.",
"نسبت به دروسم شور و شوق کمتری دارم.",
"نسبت به اهمیت دروسم تردید دارم.",
"نسبت به کاربرد دروسم بیشتر بدگمان شده ام.",
"به طور موثری میتوانم مشکلاتی را که در فعالیت های مربوط به تحصیلم بوجود می‌آید را حل کنم.",
"معتقدم که مشارکت موثری در کلاس ها دارم.",
"به عقیده خودم دانشجوی خوبی هستم.",
"وقتی به اهداف تحصیلی ام می‌رسم احساس برانگیختگی میکنم.",
"موارد جالب زیادی را در جریان تحصیل یاد گرفته‌ام.",
"در طول کلاس اطمینان دارم که در انجام کارها مؤثر هستم."
];

/* ---------- OPTIONS ---------- */
const options = [
"هرگز",
"خیلی",
"نسبتا کم",
"گاهی",
"نسبتا زیاد",
"بیشتر",
"همیشه"
];

let step = -1;
let answers = {};
const app = document.getElementById("app");

/* ---------- RENDER ---------- */
function render(){

  if(step === -1){
    app.innerHTML = `
      <p style="white-space:pre-line;line-height:2">${introText}</p>
      <button class="btn" onclick="start()">شروع</button>
    `;
    return;
  }

  if(step === 0){
    app.innerHTML = `
      <h3>اطلاعات فردی</h3>

      <label>سن:
        <input id="age" type="number">
      </label>

      <br><br>

      <label><input type="radio" name="g" value="زن"> زن</label>
      <label><input type="radio" name="g" value="مرد"> مرد</label>

      <br>
      <button class="btn" onclick="startSurvey()">ادامه</button>
    `;
    return;
  }

  const q = questions[step-1];

  app.innerHTML = `
    <h3>سوال ${step} از ${questions.length}</h3>
    <p>${q}</p>

    ${options.map(o => `
      <label class="option">
        <input type="radio" name="ans" value="${o}">
        ${o}
      </label>
    `).join('')}

    <button class="btn" onclick="next()">بعدی</button>
  `;
}

/* ---------- FLOW ---------- */
function start(){
  step = 0;
  render();
}

function startSurvey(){

  const g = document.querySelector('input[name="g"]:checked');

  if(!g){
    alert("جنسیت را انتخاب کنید");
    return;
  }

  answers.age = document.getElementById("age").value;
  answers.gender = g.value;

  step = 1;
  render();
}

function next(){

  const a = document.querySelector('input[name="ans"]:checked');

  if(!a){
    alert("یک گزینه انتخاب کنید");
    return;
  }

  answers["q"+step] = a.value;

  if(step < questions.length){
    step++;
    render();
  }else{
    finish();
  }
}

/* ---------- SEND TO SHEET ---------- */
function finish(){

  fetch(GOOGLE_SCRIPT_URL, {
    method:"POST",
    body:JSON.stringify({
      age:answers.age,
      gender:answers.gender,
      answers:questions.map((_,i)=>answers["q"+(i+1)])
    })
  });

  app.innerHTML = `
    <h2>🎉 پایان پرسشنامه</h2>
    <p>پاسخ شما ثبت شد</p>
  `;
}

render();

</script>

</body>
</html>
