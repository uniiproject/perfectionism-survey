<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پرسشنامه کمال‌گرایی</title>

<style>
body{
  font-family:tahoma;
  margin:0;
  background:linear-gradient(135deg,#ffe4ec,#fff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:90%;
  max-width:750px;
  background:#fff;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.btn{
  background:#ff4f86;
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  margin-top:15px;
}

.option{
  display:block;
  margin:10px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="box">
  <div id="app"></div>
</div>

<script>

const GOOGLE_SCRIPT_URL = "PASTE_YOUR_GOOGLE_SCRIPT_URL_HERE";

/* 📌 متن معرفی کامل */
const introText = `
شرکت‌کننده گرامی،

این پرسشنامه صرفاً در چارچوب یک پژوهش دانشگاهی تهیه شده است. تمامی اطلاعات و پاسخ‌ها کاملاً محرمانه هستند و فقط برای اهداف علمی استفاده می‌شوند.

از همکاری شما سپاسگزاریم.
`;

/* 📌 ۳۰ سوال واقعی شما */
const questions = [
"نمیتوانم حتی یک اشتباه را در کارم تحمل کنم.",
"به چیزی کمتر از کامل و ایده‌آل بودن قانع نمیشوم.",
"هرچقدر کاری را خوب انجام داده باشم، باز هم ناراضی هستم.",
"وقتی به هدف هایم میرسم باز هم احساس نارضایتی میکنم.",
"احساس میکنم همیشه باید موفق باشم.",
"اهداف و آرمان هایم بسیار عالی هستند.",
"هرچقدر کاری را درست انجام داده باشم باز هم حس میکنم کامل نیست.",
"اگر حتی یک اشتباه در کارم باشد ناراحت میشوم.",
"در مورد کارهای جزئی تردید میکنم.",
"احساس میکنم خیلی کمال گرا هستم.",
"از بستگانم انتظار کامل بودن دارم.",
"وقتی از کسی کاری میخواهم انتظار دارم کامل انجام دهد.",
"حوصله کسانی که برای بهتر شدن تلاش میکنند را ندارم.",
"نمیتوانم اشتباه دیگران را تحمل کنم.",
"هیچوقت از عملکرد دیگران راضی نیستم.",
"انتظار دارم دیگران منظم و دقیق باشند.",
"اگر کاری نصفه انجام شود، انگار انجام نشده.",
"انتظار دارم دیگران اهداف عالی داشته باشند.",
"تصور میکنم دیگران باید انتظاراتم را برآورده کنند.",
"نمی‌توانم نسبت به کسانی که تلاش نمی‌کنند احساس خوبی داشته باشم.",
"خانواده از من توقع کامل بودن دارند.",
"اطرافیان انتظار موفقیت کامل از من دارند.",
"احساس میکنم دیگران کارهایم را با دید انتقادی نگاه میکنند.",
"حتی وقتی عالی کار میکنم باز هم انتظار بیشتری هست.",
"احساس میکنم دیگران بیش از حد از من توقع دارند.",
"در کودکی اگر اشتباه میکردم سرزنش میشدم.",
"والدینم اشتباهاتم را نادیده نمی‌گرفتند.",
"والدینم از من انتظار عالی بودن داشتند.",
"احساس میکنم هیچوقت نمیتوانم توقعات خانواده را برآورده کنم.",
"اگر اشتباه کنم دیگران تحقیرم میکنند."
];

const options = ['کاملاً موافق','موافق','نظری ندارم','مخالف','کاملاً مخالف'];

let step = -1;
let answers = {};

const app = document.getElementById('app');

/* ---------- UI ---------- */

function render(){

  if(step === -1){
    app.innerHTML = `
      <div>
        <p style="white-space:pre-line; line-height:1.8">${introText}</p>
        <button class="btn" onclick="startIntro()">شروع</button>
      </div>
    `;
    return;
  }

  if(step === 0){
    app.innerHTML = `
      <div>
        <h3>اطلاعات فردی</h3>

        <label>سن: <input id="age" type="number"></label><br><br>

        <label><input type="radio" name="g" value="زن"> زن</label>
        <label><input type="radio" name="g" value="مرد"> مرد</label>

        <br>
        <button class="btn" onclick="startSurvey()">ادامه</button>
      </div>
    `;
    return;
  }

  const q = questions[step - 1];

  app.innerHTML = `
    <div>
      <h3>سوال ${step} از ${questions.length}</h3>
      <p>${q}</p>

      ${options.map(o => `
        <label class="option">
          <input type="radio" name="ans" value="${o}">
          ${o}
        </label>
      `).join('')}

      <button class="btn" onclick="next()">بعدی</button>
    </div>
  `;
}

/* ---------- flow ---------- */

window.startIntro = function(){
  step = 0;
  render();
}

window.startSurvey = function(){
  const g = document.querySelector('input[name=g]:checked');

  if(!g){
    alert('جنسیت را انتخاب کنید');
    return;
  }

  answers.age = document.getElementById('age').value;
  answers.gender = g.value;

  step = 1;
  render();
}

window.next = function(){
  const a = document.querySelector('input[name=ans]:checked');

  if(!a){
    alert('یک گزینه انتخاب کنید');
    return;
  }

  answers['q'+step] = a.value;

  if(step < questions.length){
    step++;
    render();
  } else {
    finish();
  }
}

/* ---------- Google Sheets ---------- */

function finish(){

  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      age: answers.age,
      gender: answers.gender,
      answers: questions.map((_,i)=>answers['q'+(i+1)])
    })
  });

  app.innerHTML = `
    <div>
      <h2>🎉 پایان پرسشنامه</h2>
      <p>پاسخ شما با موفقیت ثبت شد</p>
    </div>
  `;
}

render();

</script>

</body>
</html>
