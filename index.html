
<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پرسشنامه چندبعدی کمال گرایی</title>
<style>
body{
font-family:tahoma;
background:linear-gradient(135deg,#fff0f5,#ffe4ec);
margin:0;
padding:20px;
}

.box{
max-width:760px;
margin:20px auto;
background:#fff;
border-radius:24px;
padding:30px;
box-shadow:0 10px 30px rgba(236,72,153,.15);
animation:fade .4s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.progress{
height:10px;
background:#fce7f3;
border-radius:99px;
overflow:hidden;
margin-bottom:25px;
}

.bar{
height:100%;
background:linear-gradient(90deg,#f9a8d4,#ec4899);
width:0%;
transition:.4s;
}

.btn{
background:#ec4899;
color:#fff;
border:none;
padding:12px 22px;
border-radius:14px;
cursor:pointer;
font-size:16px;
}

.option{
display:block;
padding:14px;
border:2px solid #fbcfe8;
border-radius:14px;
margin:10px 0;
cursor:pointer;
transition:.2s;
background:#fff;
}

.option:hover{
background:#fdf2f8;
border-color:#ec4899;
}

h1,h2,h3{
color:#be185d;
}

input[type=number]{
padding:10px;
border:1px solid #f9a8d4;
border-radius:10px;
width:100%;
max-width:200px;
}
<script>
const questions=['نمیتوانم حتی یک اشتباه را در کارم تحمل کنم.', 'به چیزی کمتر از کامل و ایده\u200cآل بودم قانع نمیشوم.', 'هرچقدر کاری را خوب انجام داده باشم، بازم از عملکردم ناراضی هستم.', 'وقتی به هدف هایم میرسم باز هم احساس نارضایتی میکنم.', 'احساس میکنم همیشه در زندگی (شغل،تحصیل و غیره) باید موفق باشم.', 'اهداف و آرمان هایم بسیار عالی هستند.', 'هرچقدر کاری را درست انجام داده باشم باز هم حس میکنم کاملا درست انجام نداده\u200cام.', 'اگر حتی یک اشتباه در کارم باشد ناراحت و آشفته میشوم.', 'درمورد هرکار جزئی که انجام میدهم تردید میکنم.', 'احساس میکنم که خیلی کمال گرا هستم.', 'از بستگانم انتظار دارم که کامل و ایده آل باشند.', 'وقتی از کسی میخواهم کاری را انجام دهد انتظار دارم کامل و بدون نقص انجام دهد.', 'حوصله کسانی که برای بهتر شدن خودشان تلاشو پیشرفت میکنند را ندارم.', 'نمیتوانم اشتباه دیگران را تحمل کنم.', 'هیچوقت از عملکرد دیگران احساس رضایت نمیکنم.', 'انتظار دارم دیگران همواره منظم و دقیق باشند.', 'وقتی کسی کاری را نصفه نیمه انجام میدهد، احساس میکنم اصلا کاری انجام نداده است.', 'انتظار دارم دیگران به دنبال اهداف و آرمان های عالی باشند.', 'تصور میکنم دیگران بتوانند انتظارات من را براورده سازند.', 'نمیتوانم نسبت به کسانی که برای تحقق اهداف و آرمان های عالی تلاش نمیکنند ،احساس خوبی داشته باشم.', 'خانواده از من توقع دارند کامل و ایده\u200cآل باشم.', 'اطرافیانم انتظار دارند در همه کارها موفق باشم.', 'وقتی کاری را انجام میدهم احساس میکنم دیگرام با دید انتقادی آن را قضاوت خواهند کرد.', 'هرچقدر کاری را عالی و بی نقض انجام می\u200cدهم بازهم دیگران انتظار دارند که کامل تر انجام دهم.', 'احساس میکنم دیگران بیش از حد از من توقع دارند.', 'در کودکی هرگاه کاری را درست انجام نمیدادم سرزنش و تنبیه میشدم.', 'والدینم هیچ وقت اشتباهات من را نادیده نگرفتند.', 'والدینم از من میخواستند که در هرکاری و هرچیزی عالی باشم.', 'تصور میکنم هرگز نمیتوانم انتظارات و توقعات خانواده ام را براورده سازم.', 'اگر اشتباهی از من سر بزند دیگران با دیده تحقیر به من نگاه میکنند.'];
const opts=['کاملاً موافق', 'موافق', 'نظری ندارم', 'مخالف', 'کاملاً مخالف'];
let step=0,answers={};

function function autoNext(){
setTimeout(nextQ,500);
} render(){
 const app=document.getElementById('app');
 document.getElementById('bar').style.width=((step)/(questions.length+1))*100+'%';
 if(step===0){
 app.innerHTML=`<h1>پرسشنامه چندبعدی کمال گرایی</h1>
 <p>شرکت‌کننده گرامی، این پرسشنامه صرفاً در چارچوب یک پژوهش دانشگاهی تهیه شده است. تمامی اطلاعات و پاسخ‌های ارائه‌شده توسط شما کاملاً محرمانه تلقی شده و فقط برای اهداف علمی و پژوهشی مورد استفاده قرار خواهد گرفت.</p>
 <label>سن <input id="age" type="number"></label><br><br>
 <label><input type="radio" name="g" value="زن"> زن</label>
 <label><input type="radio" name="g" value="مرد"> مرد</label><br><br>
 <button class="btn" onclick="nextIntro()">شروع</button>`;
 return;
 }
 const q=questions[step-1];
 app.innerHTML=`<h3>سوال ${step} از 30</h3><p>${q}</p>`+opts.map(o=>`
<label class="option">
<input type="radio"
name="ans"
value="${o}"
onchange="autoNext()">
${o}
</label>
`).join('');
}
function nextIntro(){
 answers.age=document.getElementById('age').value;
 let g=document.querySelector('input[name=g]:checked');
 answers.gender=g?g.value:'';
 step=1; render();
}
function nextQ(){
 let a=document.querySelector('input[name=ans]:checked');
 if(!a) return alert('لطفا یک گزینه انتخاب کنید');
 answers['q'+step]=a.value;
 if(step<questions.length){step++;render();}
 else {
 document.getElementById('bar').style.width='100%';
 document.getElementById('app').innerHTML=`
<div style="text-align:center;padding:40px 20px">
<h2>🌷 سپاسگزاریم</h2>
<p>از مشارکت شما در این پژوهش سپاسگزاریم.</p>
<p>پاسخ شما با موفقیت ثبت شد.</p>
</div>`;
