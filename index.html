<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پرسشنامه کمال‌گرایی</title>

<!-- فونت فارسی بهتر -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Vazirmatn',tahoma;
  margin:0;
  background:linear-gradient(135deg,#ffe4ec,#fff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  width:90%;
  max-width:780px;
  background:#fff;
  border-radius:20px;
  padding:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  overflow:hidden;
}

/* progress */
.progress{
  height:10px;
  background:#f3d6e3;
  border-radius:50px;
  overflow:hidden;
  margin-bottom:20px;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff7aa2,#ffb3c7);
  transition:width .4s ease;
}

/* سوالات */
.fade{
  animation:fade .35s ease;
}
@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* دکمه مدرن */
.btn{
  background:linear-gradient(135deg,#ff7aa2,#ff4f86);
  color:#fff;
  border:none;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  transition:.3s;
  margin-top:15px;
  box-shadow:0 6px 15px rgba(255,79,134,.25);
}
.btn:hover{
  transform:translateY(-2px);
}

/* گزینه‌ها */
.option{
  display:block;
  padding:12px;
  border:1px solid #f0c2d1;
  border-radius:12px;
  margin:10px 0;
  cursor:pointer;
  transition:.3s;
}
.option:hover{
  background:#ffeaf1;
  transform:scale(1.01);
}

/* صفحه تشکر */
.thanks{
  text-align:center;
  padding:40px 20px;
  animation:fade .5s ease;
}
.thanks h2{
  color:#ff4f86;
}
</style>
</head>

<body>

<div class="box">
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div id="app"></div>
</div>

<script>

const questions = [
'نمیتوانم حتی یک اشتباه را در کارم تحمل کنم.',
'به چیزی کمتر از کامل و ایده‌آل قانع نمیشوم.',
'هرچقدر کاری را خوب انجام داده باشم باز هم ناراضی هستم.',
'وقتی به هدفم میرسم باز هم احساس نارضایتی میکنم.',
'احساس میکنم همیشه باید موفق باشم.',
'اهدافم بسیار عالی هستند.',
'باز هم حس میکنم کامل انجام نداده‌ام.',
'اگر اشتباهی باشد ناراحت میشوم.',
'در کارهای جزئی تردید میکنم.',
'خودم را کمال‌گرا می‌دانم.',
'از دیگران انتظار کامل بودن دارم.',
'تحمل اشتباه دیگران را ندارم.',
'دیگران را زیاد قضاوت می‌کنم.',
'از عملکرد دیگران رضایت ندارم.',
'دیگران باید دقیق باشند.',
'اگر کاری نصفه باشد بی‌ارزش است.',
'از افراد بی‌هدف خوشم نمی‌آید.',
'دیگران از من توقع زیادی دارند.',
'احساس می‌کنم همیشه زیر نگاه انتقادی هستم.',
'در کودکی زیاد سرزنش می‌شدم.'
];

const opts = ['کاملاً موافق','موافق','نظری ندارم','مخالف','کاملاً مخالف'];

let step = 0;
let answers = {};

function render(){

  const app = document.getElementById('app');
  const bar = document.getElementById('bar');

  bar.style.width = (step / questions.length) * 100 + '%';

  if(step === 0){
    app.innerHTML = `
      <div class="fade">
      <h2>پرسشنامه کمال‌گرایی</h2>
      <p>لطفاً با دقت به سوالات پاسخ دهید.</p>

      <label>سن: <input id="age" type="number"></label><br><br>

      <label><input type="radio" name="g" value="زن"> زن</label>
      <label><input type="radio" name="g" value="مرد"> مرد</label>

      <br>
      <button class="btn" onclick="nextIntro()">شروع</button>
      </div>
    `;
    return;
  }

  const q = questions[step - 1];
  const selected = answers['q'+step];

  app.innerHTML = `
    <div class="fade">
    <h3>سوال ${step} از ${questions.length}</h3>
    <p>${q}</p>

    ${opts.map(o => `
      <label class="option">
        <input type="radio" name="ans" value="${o}" ${selected===o?'checked':''}>
        ${o}
      </label>
    `).join('')}

    <button class="btn" onclick="nextQ()">بعدی</button>
    </div>
  `;
}

function nextIntro(){

  const age = document.getElementById('age').value;
  const g = document.querySelector('input[name=g]:checked');

  if(!g){
    alert('لطفا جنسیت را انتخاب کنید');
    return;
  }

  answers.age = age;
  answers.gender = g.value;

  step = 1;
  render();
}

function nextQ(){

  const a = document.querySelector('input[name=ans]:checked');
  if(!a){
    alert('لطفا یک گزینه انتخاب کنید');
    return;
  }

  answers['q'+step] = a.value;

  if(step < questions.length){
    step++;
    render();
  } else {
    showThanks();
  }
}

function showThanks(){
  document.getElementById('bar').style.width = '100%';

  document.getElementById('app').innerHTML = `
    <div class="thanks">
      <h2>🎉 سپاس از شما</h2>
      <p></label>
`).join('');
}
function nextIntro(){
 answers.age=document.getElementById('age').value;
 let g=document.querySelector('input[name=g]:checked');
 answers.gender=g?g.value:'';
 step=1; render();
}
function nextQ(){
 let a=document.querySelector('input[name=ans]:checked');
 if(!a) return alert('لطفا یک گزینه انتخاب کنید');
 answers['q'+step]=a.value;
 if(step<questions.length){step++;render();}
 else {
 document.getElementById('bar').style.width='100%';
 document.getElementById('app').innerHTML=`
<div style="text-align:center;padding:40px 20px">
<h2>🌷 سپاسگزاریم</h2>
<p>از مشارکت شما در این پژوهش سپاسگزاریم.</p>
<p>پاسخ شما با موفقیت ثبت شد.</p>
</div>`;
